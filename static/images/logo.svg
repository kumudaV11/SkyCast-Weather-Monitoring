<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Glow Orb -->
  <circle cx="50" cy="50" r="44" fill="url(#glowGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="50" cy="50" r="42" fill="#0B1120" stroke="url(#skyGrad)" stroke-width="2" />
  
  <!-- Stylized Cloud -->
  <path d="M30 60 A14 14 0 0 1 40 37 A20 20 0 0 1 72 43 A13 13 0 0 1 72 60 Z" 
        fill="url(#skyGrad)" opacity="0.9" filter="url(#glow)"/>
        
  <!-- Lightning Bolt Accent -->
  <polygon points="50,48 43,62 49,62 46,75 57,59 51,59" fill="#FACC15" />
</svg>
