# SKYCAST Production Nginx Reverse Proxy Configuration
# Place in: /etc/nginx/sites-available/skycast and symlink to /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 10M;

    # Gzip Compression for Fast Assets Delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Assets Cache
    location /static/ {
        alias /var/www/skycast/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # AWS ALB Target Group Health Check Endpoint
    location /api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Application Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
